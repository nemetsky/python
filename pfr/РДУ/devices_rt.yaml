- host: RT-1
  device_type: cisco_ios
  username: sshkey
  use_keys: true
  key_file: /home/administrator/.ssh/id_rsa
  #  password: "1"
  allow_agent: false
  #look_for_keys: false
  # Параметры совместимости для Paramiko
  disabled_algorithms:
    pubkeys:
      - "rsa-sha2-256"
      - "rsa-sha2-256-cert-v01@openssh.com"
      - "rsa-sha2-512"
      - "rsa-sha2-512-cert-v01@openssh.com"
